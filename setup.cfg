# flake8 settings for pre-commit, kept in line with ament_flake8's defaults
# (ament_flake8 runs in `colcon test` with its own built-in config).
[flake8]
max-line-length = 99
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
exclude = build,install,log,bags,can_feather_firmware,__pycache__

# autopep8 also reads max-line-length from [flake8] above
[pycodestyle]
max-line-length = 99

# Matches flake8-import-order's google style
[isort]
profile = google
line_length = 99
# ament_flake8 has no application-import-names, so this repo's packages sort
# together with other third-party imports rather than in their own group
known_third_party = prizm_*,hitech_*
# google profile splits `from x import a, b`; flake8 accepts either, so avoid churn
force_single_line = false
