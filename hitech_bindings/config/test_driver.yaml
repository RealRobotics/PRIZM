motor_driver_test:
  ros__parameters:
    hitech_driver.device_addr : "/dev/ttyUSB2"
    hitech_driver.num_servos: 2
    hitech_driver.num_motors: 1
    hitech_driver.servo_ids: 
      - 0x10
      - 0x21
      
    hitech_driver.motor_ids:
      - 0x06
    #   - 0x09
    #   - 0x04

    hitech_driver.servo_mins:
      - 0
      - 0
      # - 290

    hitech_driver.servo_zeros:
    - 180
    - 180
    # - -10

    hitech_driver.servo_maxs:
    - 360
    - 360
    # - 40000

    hitech_driver.profile_velocity: 0.0

    hitech_driver.profile_acceleration: 0.0
    # servo_min: 0
    # servo_max: 360
