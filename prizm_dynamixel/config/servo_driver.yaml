driver:
  ros__parameters:
    motor_driver.device_addr : "/dev/ttyUSB0"
    motor_driver.num_servos: 1
    motor_driver.num_motors: 1
    motor_driver.servo_ids: 
      - 0x00
      # - 0x01
    motor_driver.motor_ids:
      # - 0x00
      - 0x01

    motor_driver.profile_velocity: 30.0

    motor_driver.profile_acceleration: 15.0
  
    motor_driver.servo_mins:
      - -300

    motor_driver.servo_zeros:
    - 0

    motor_driver.servo_maxs:
    - 4093

    motor_driver.debug: true
    # servo_min: 0
    # servo_max: 360