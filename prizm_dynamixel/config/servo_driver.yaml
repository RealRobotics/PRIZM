driver:
  ros__parameters:
    motor_driver.device_addr : "/dev/ttyUSB1"
    motor_driver.num_servos: 1
    motor_driver.num_motors: 0
    motor_driver.servo_ids: 
      - 0x00
      # - 0x02
      # - 0x03
      # - 0x01
    # motor_driver.motor_ids:
      # - 0x00
      # - 0x01

    motor_driver.profile_velocity: 3.0

    motor_driver.profile_acceleration: 15.0
  
    motor_driver.servo_mins:
      - -30000
      # - -30000
      # - -30000

    motor_driver.servo_zeros:
    - 0
    # - 0
    # - 0

    motor_driver.servo_maxs:
    - 409300000
    # - 409300000
    # - 409300000

    motor_driver.debug: false
    # servo_min: 0
    # servo_max: 360
