# flake8 settings for pre-commit, kept in line with ament_flake8's defaults
# (ament_flake8 runs in `colcon test` with its own built-in config).
[flake8]
max-line-length = 99
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
exclude = build,install,log,bags,can_feather_firmware,__pycache__
